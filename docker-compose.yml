services:
  frontend:
    image: ${APP_IMAGE:-thecommerce-frontend:local}
    build: .
    container_name: thecommerce-frontend
    # Published on host port 4445. All /api/** calls are proxied server-side
    # to the backend over the private "thecommerce-net" network.
    ports:
      - "4445:3000"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://thecommerce-backend:8080}
      # Reverse proxies (nginx, Traefik, …) in front of this container; used to find the shopper's real IP
      # for the backend's per-IP OTP limit. 0 = browsers connect to this container directly.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    networks:
      - thecommerce
    restart: unless-stopped

networks:
  thecommerce:
    name: thecommerce-net
    external: true
