when:
  - event: [push, pull_request, manual]
    branch: main

labels:
  backend: docker

steps:
  - name: checks-and-build
    image: node:24-alpine
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    commands:
      - npm ci
      - npm run lint
      - npm run build

  - name: docker-build
    image: docker:29-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build --tag "thecommerce-frontend:$${CI_COMMIT_SHA}" .
    when:
      - event: [push, manual]
        branch: main

  - name: deploy
    image: docker:29-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        set -eu
        docker network inspect thecommerce-net > /dev/null 2>&1 || docker network create thecommerce-net
        export APP_IMAGE="thecommerce-frontend:$${CI_COMMIT_SHA}"
        docker compose up -d
    when:
      - event: [push, manual]
        branch: main
